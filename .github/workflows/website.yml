name: Website checks and release
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:blog
      - run: python3 -m unittest discover -s integrations/hermes -p 'test_*.py'
      - run: npm run build
      - run: npm run typecheck
      # Protected main merges trigger Coolify's signed repository webhook.
      # Its REST API remains restricted to trusted IPs; CI needs no Coolify token.
      # The local publisher verifies live releases and sends Telegram receipts.
      # This keeps credentials local and does not depend on runner/site access.
