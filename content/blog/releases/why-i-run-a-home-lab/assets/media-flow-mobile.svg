<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1100" viewBox="0 0 600 1100" role="img" aria-labelledby="title desc"><title id="title">From request to watching</title><desc id="desc">Media workflow from an Overseerr request through Sonarr or Radarr and a configured download client to the library, then Plex and viewing devices.</desc><rect width="600" height="1100" rx="18" fill="#f7faf9"/><g font-family="DejaVu Sans, sans-serif" fill="#123b43"><text x="32" y="55" font-size="30" font-weight="700">From request to watching</text><rect x="50" y="100" width="500" height="110" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="70" y="138" font-size="32" font-weight="700">Overseerr</text><text x="70" y="172" font-size="28" fill="#45616a">Discover and request</text><path d="M300 212 L300 245" stroke="#397a76" stroke-width="3" fill="none"/><polyline points="294,235 300,245 306,235" stroke="#397a76" stroke-width="3" fill="none"/><rect x="50" y="255" width="500" height="110" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="70" y="293" font-size="32" font-weight="700">Sonarr / Radarr</text><text x="70" y="327" font-size="28" fill="#45616a">TV series / films</text><path d="M300 367 L300 400" stroke="#397a76" stroke-width="3" fill="none"/><polyline points="294,390 300,400 306,390" stroke="#397a76" stroke-width="3" fill="none"/><rect x="50" y="410" width="500" height="110" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="70" y="448" font-size="32" font-weight="700">Download client</text><text x="70" y="482" font-size="28" fill="#45616a">Fetch requested media</text><path d="M300 522 L300 555" stroke="#397a76" stroke-width="3" fill="none"/><polyline points="294,545 300,555 306,545" stroke="#397a76" stroke-width="3" fill="none"/><rect x="50" y="565" width="500" height="110" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="70" y="603" font-size="32" font-weight="700">Media library</text><text x="70" y="637" font-size="28" fill="#45616a">Organised files</text><path d="M300 677 L300 710" stroke="#397a76" stroke-width="3" fill="none"/><polyline points="294,700 300,710 306,700" stroke="#397a76" stroke-width="3" fill="none"/><rect x="50" y="720" width="500" height="110" rx="14" fill="#e0efec" stroke="#b6cdca" stroke-width="2"/><text x="70" y="758" font-size="32" font-weight="700">Plex</text><text x="70" y="792" font-size="28" fill="#45616a">Serve the library</text><path d="M300 832 L300 865" stroke="#397a76" stroke-width="3" fill="none"/><polyline points="294,855 300,865 306,855" stroke="#397a76" stroke-width="3" fill="none"/><rect x="50" y="875" width="500" height="110" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="70" y="913" font-size="32" font-weight="700">Your devices</text><text x="70" y="947" font-size="28" fill="#45616a">Watch across devices</text><text x="50" y="1060" font-size="27" fill="#45616a">Requests → files → playback</text></g></svg>