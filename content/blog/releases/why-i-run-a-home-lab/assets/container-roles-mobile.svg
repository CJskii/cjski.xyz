<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Who does what around Docker?</title><desc id="desc">Separate roles around Docker: Coolify builds and deploys projects, Portainer manages containers and stacks, Watchtower updates selected images, and Traefik routes web requests to applications.</desc><rect width="600" height="1000" rx="18" fill="#f7faf9"/><g font-family="DejaVu Sans, sans-serif" fill="#123b43"><text x="32" y="55" font-size="30" font-weight="700">Who does what around Docker?</text><rect x="50" y="95" width="500" height="140" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="70" y="133" font-size="32" font-weight="700">Coolify</text><text x="70" y="167" font-size="28" fill="#45616a">Build and deploy</text><text x="70" y="195" font-size="28" fill="#45616a">from source</text><rect x="50" y="265" width="500" height="140" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="70" y="303" font-size="32" font-weight="700">Portainer</text><text x="70" y="337" font-size="28" fill="#45616a">View containers;</text><text x="70" y="365" font-size="28" fill="#45616a">manage stacks</text><rect x="50" y="435" width="500" height="140" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="70" y="473" font-size="32" font-weight="700">Watchtower</text><text x="70" y="507" font-size="28" fill="#45616a">Update selected</text><text x="70" y="535" font-size="28" fill="#45616a">container images</text><rect x="50" y="605" width="500" height="140" rx="14" fill="#e0efec" stroke="#b6cdca" stroke-width="2"/><text x="70" y="643" font-size="32" font-weight="700">Docker</text><text x="70" y="677" font-size="28" fill="#45616a">Run the application</text><text x="70" y="705" font-size="28" fill="#45616a">containers</text><rect x="50" y="775" width="500" height="140" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="70" y="813" font-size="32" font-weight="700">Traefik</text><text x="70" y="847" font-size="28" fill="#45616a">Route incoming</text><text x="70" y="875" font-size="28" fill="#45616a">web requests</text><text x="50" y="980" font-size="26" fill="#45616a">Separate jobs, not a request chain.</text></g></svg>