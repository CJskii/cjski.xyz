<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">From request to watching</title><desc id="desc">Media workflow from an Overseerr request through Sonarr or Radarr and a configured download client to the library, then Plex and viewing devices.</desc><rect width="1200" height="700" rx="18" fill="#f7faf9"/><g font-family="DejaVu Sans, sans-serif" fill="#123b43"><text x="32" y="55" font-size="35" font-weight="700">From request to watching</text><rect x="36" y="135" width="348" height="125" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="56" y="173" font-size="25" font-weight="700">Overseerr</text><text x="56" y="207" font-size="22" fill="#45616a">Discover and request</text><path d="M386 197 L416 197" stroke="#397a76" stroke-width="3" fill="none"/><polyline points="406,191 416,197 406,203" stroke="#397a76" stroke-width="3" fill="none"/><rect x="426" y="135" width="348" height="125" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="446" y="173" font-size="25" font-weight="700">Sonarr / Radarr</text><text x="446" y="207" font-size="22" fill="#45616a">TV series / films</text><path d="M776 197 L806 197" stroke="#397a76" stroke-width="3" fill="none"/><polyline points="796,191 806,197 796,203" stroke="#397a76" stroke-width="3" fill="none"/><rect x="816" y="135" width="348" height="125" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="836" y="173" font-size="25" font-weight="700">Download client</text><text x="836" y="207" font-size="22" fill="#45616a">Fetch requested media</text><rect x="36" y="405" width="348" height="125" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="56" y="443" font-size="25" font-weight="700">Media library</text><text x="56" y="477" font-size="22" fill="#45616a">Organised files</text><path d="M386 467 L416 467" stroke="#397a76" stroke-width="3" fill="none"/><polyline points="406,461 416,467 406,473" stroke="#397a76" stroke-width="3" fill="none"/><rect x="426" y="405" width="348" height="125" rx="14" fill="#e0efec" stroke="#b6cdca" stroke-width="2"/><text x="446" y="443" font-size="25" font-weight="700">Plex</text><text x="446" y="477" font-size="22" fill="#45616a">Serve the library</text><path d="M776 467 L806 467" stroke="#397a76" stroke-width="3" fill="none"/><polyline points="796,461 806,467 796,473" stroke="#397a76" stroke-width="3" fill="none"/><rect x="816" y="405" width="348" height="125" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="836" y="443" font-size="25" font-weight="700">Your devices</text><text x="836" y="477" font-size="22" fill="#45616a">Watch across devices</text><path d="M990 262 V310 H210 V393" stroke="#397a76" stroke-width="3" fill="none"/><polyline points="204,383 210,393 216,383" stroke="#397a76" stroke-width="3" fill="none"/><text x="36" y="640" font-size="23" fill="#45616a">Request handling → files in the library → playback</text></g></svg>