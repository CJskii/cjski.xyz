<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Who does what around Docker?</title><desc id="desc">Separate roles around Docker: Coolify builds and deploys projects, Portainer manages containers and stacks, Watchtower updates selected images, and Traefik routes web requests to applications.</desc><rect width="1200" height="760" rx="18" fill="#f7faf9"/><g font-family="DejaVu Sans, sans-serif" fill="#123b43"><text x="32" y="55" font-size="35" font-weight="700">Who does what around Docker?</text><rect x="35" y="120" width="350" height="150" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="55" y="158" font-size="25" font-weight="700">Coolify</text><text x="55" y="192" font-size="22" fill="#45616a">Build and deploy</text><text x="55" y="220" font-size="22" fill="#45616a">from source</text><rect x="425" y="120" width="350" height="150" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="445" y="158" font-size="25" font-weight="700">Portainer</text><text x="445" y="192" font-size="22" fill="#45616a">View containers;</text><text x="445" y="220" font-size="22" fill="#45616a">manage stacks</text><rect x="815" y="120" width="350" height="150" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="835" y="158" font-size="25" font-weight="700">Watchtower</text><text x="835" y="192" font-size="22" fill="#45616a">Update selected</text><text x="835" y="220" font-size="22" fill="#45616a">container images</text><rect x="230" y="360" width="740" height="145" rx="14" fill="#e0efec" stroke="#b6cdca" stroke-width="2"/><text x="250" y="398" font-size="25" font-weight="700">Docker</text><text x="250" y="432" font-size="22" fill="#45616a">Run the application</text><text x="250" y="460" font-size="22" fill="#45616a">containers</text><path d="M210 272 V315 H600 V348" stroke="#397a76" stroke-width="3" fill="none"/><path d="M600 272 V315 H600 V348" stroke="#397a76" stroke-width="3" fill="none"/><path d="M990 272 V315 H600 V348" stroke="#397a76" stroke-width="3" fill="none"/><rect x="35" y="565" width="350" height="145" rx="14" fill="#ffffff" stroke="#b6cdca" stroke-width="2"/><text x="55" y="603" font-size="25" font-weight="700">Traefik</text><text x="55" y="637" font-size="22" fill="#45616a">Route incoming</text><text x="55" y="665" font-size="22" fill="#45616a">web requests</text><text x="430" y="610" font-size="24" font-weight="700">Web request → Traefik → application</text><text x="430" y="650" font-size="22" fill="#45616a">The management tools stay outside that path.</text></g></svg>